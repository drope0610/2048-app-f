name: Lab 2 Script Execution

on:
  workflow_dispatch:

jobs:
  lab2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.28.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Run Lab 2 script
        run: bash deliverables/lab02/lab2.sh
